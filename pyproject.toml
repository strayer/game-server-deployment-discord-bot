[project]
name = "game-server-deploynment-discord-bot"
version = "0.1.0"
description = ""
authors = [{ name = "Sven Grunewaldt", email = "strayer@olle-orks.org" }]
dependencies = [
    "loguru >=0.7.0,<0.8.0",
    "hikari>=2.1.0,<3.0.0",
    "hikari-lightbulb >=2.3.0,<3.0.0",
    "rq >=2.1.0,<3.0.0",
    "sentry-sdk[rq] >=2.8.0,<3.0.0",
    "docker >=7.0.0,<8.0.0",
    "backoff >=2.2.1,<3.0.0",
    "requests >=2.32.0,<3.0.0",
    "hcloud >=2.0.0,<3.0.0",
    "jinja2 >=3.1.0,<4.0.0",
]
requires-python = ">=3.14,<3.15"
license = "MIT"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-snapshot>=0.9.0",
    "pytest-cov>=6.0.0",
    # [lua] so redis-py Lock release (an evalsha script) works in tests.
    "fakeredis[lua]>=2.20.0",
]

[tool.setuptools.packages.find]
include = ["discord_bot*"]

[tool.setuptools.package-data]
"discord_bot.cloud_init" = ["*.yaml.j2"]

[tool.uv]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportUnusedImport = false

[tool.ruff.lint]
extend-select = ["TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
